<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мёртвый Сектор</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D view under a CRT veil; Doom-style status bar; menus are centred lists in a 5-pixel bitmap face with a blinking skull cursor */
:root{
  --void:#0b0807; --plate:#2a211b; --plate-lo:#17110e; --plate-hi:#54443a; --well:#110c0a;
  --red:#c42c18; --red-hi:#ff6a32; --red-lo:#4a0b05; --amber:#f2b13a; --toxic:#93e04c; --plasma:#5fd8ff; --bone:#e8d8b8; --dim:#8a7a68;
  --px:'Tiny5','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);overflow:hidden;font-family:var(--px);-webkit-font-smoothing:none}
#game{position:fixed;inset:0;overflow:hidden;background:var(--void);user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated;cursor:crosshair}
#view.smooth{image-rendering:auto}
#fx-dmg,#fx-pick,#fx-low{position:absolute;inset:0;pointer-events:none;opacity:0}
#fx-dmg{background:radial-gradient(ellipse at center,rgba(200,0,0,.15) 30%,rgba(170,0,0,.75) 100%)}
#fx-pick{background:rgba(255,220,120,.18)}
#fx-low{background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,0,.55) 100%)}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
#crosshair::before,#crosshair::after{content:"";position:absolute;background:var(--amber);box-shadow:0 0 0 1px #000}
#crosshair::before{left:10px;top:0;width:2px;height:22px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
#crosshair::after{top:10px;left:0;height:2px;width:22px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%)}
#crt{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.2) 2px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#melt{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:30;pointer-events:none}
#msgs{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none;font-size:16px;text-shadow:2px 2px 0 #000;max-width:60vw}
#msgs div{transition:opacity .5s}
#minimap{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:150px;height:auto;opacity:.85;image-rendering:pixelated;border:2px solid #000;outline:1px solid var(--plate-hi);background:rgba(0,0,0,.45)}
#bossbar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,52vw);text-align:center;pointer-events:none}
#bossbar .name{font-size:24px;color:var(--amber);text-shadow:2px 2px 0 #000}
#bossbar .track{height:12px;margin-top:4px;background:#1b0a07;border:2px solid #000}
#bossbar .fill{height:100%;width:100%;background:repeating-linear-gradient(90deg,#d8301a 0 6px,#a01a0c 6px 8px)}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:banner 3.2s steps(24) forwards}
#banner .t{font-size:clamp(40px,8vw,80px);line-height:1;color:var(--red);text-shadow:0 5px 0 var(--red-lo),5px 5px 0 #000;padding-inline:16px}
#banner .s{font-size:clamp(16px,2.4vw,24px);color:var(--amber);margin-top:14px;text-shadow:2px 2px 0 #000;padding-inline:16px}
@keyframes banner{0%{opacity:0}5%{opacity:1}80%{opacity:1}100%{opacity:0}}

#hud{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.15fr auto 1fr 1.35fr 1.1fr;gap:3px;padding:5px max(8px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:linear-gradient(var(--plate),var(--plate-lo));border-top:3px solid #000;box-shadow:inset 0 2px 0 var(--plate-hi);pointer-events:none}
.cell{background:var(--well);border:2px solid #000;box-shadow:inset 0 0 0 2px #2e241e,inset 0 4px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 6px;min-width:0;position:relative}
.cell::before,.cell::after{content:"";position:absolute;top:5px;width:3px;height:3px;background:#6a5a4e}
.cell::before{left:5px}.cell::after{right:5px}
.big{font-size:clamp(24px,4.2vw,48px);color:var(--red);text-shadow:3px 3px 0 #000;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.big.ok{color:var(--amber)}
.lbl{font-size:clamp(10px,1.25vw,16px);color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.face{padding:3px}
#face{width:clamp(42px,5.4vw,70px);height:auto;aspect-ratio:1;image-rendering:pixelated;display:block}
.slots{display:flex;gap:8px;font-size:clamp(16px,2.4vw,32px)}
.slots span{color:#4f4239;text-shadow:2px 2px 0 #000;min-width:1em;text-align:center}
.slots span.have{color:var(--amber)}
.slots span.cur{color:var(--bone);text-shadow:0 0 0 #000,2px 2px 0 var(--red)}
.mid{font-size:clamp(16px,2.4vw,32px);color:var(--bone);text-shadow:2px 2px 0 #000;white-space:nowrap}
.small{font-size:clamp(10px,1.2vw,16px);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.small b{color:var(--bone);font-weight:400}
@media (max-width:620px){#hud{grid-template-columns:1fr 1fr auto 1fr 1fr}.cell.arms{display:none}#minimap{width:96px}}

.menu-btn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:var(--plate-lo);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--plate-hi);color:var(--bone);font-family:var(--px);font-size:16px;padding:6px 10px;z-index:5;cursor:pointer}
.menu-btn .k{color:var(--amber)}
.menu-btn:hover{color:var(--red-hi)}

#ui{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(52px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at center,rgba(8,5,4,.35),rgba(8,5,4,.86) 75%);overflow-y:auto;text-align:center;cursor:default}
#ui>*{flex-shrink:0}
#logo{image-rendering:pixelated;display:block;max-width:100%}
.press{font-size:clamp(24px,3.4vw,32px);color:var(--bone);text-shadow:3px 3px 0 #000;margin-top:20px}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.uihead{font-size:clamp(40px,7vw,64px);line-height:1;color:var(--red);text-shadow:0 5px 0 var(--red-lo),5px 5px 0 #000;margin-bottom:6px}
.utext{font-size:clamp(20px,2.8vw,32px);max-width:30ch;line-height:1.25;text-shadow:3px 3px 0 #000}
.usub{font-size:clamp(20px,2.8vw,32px);color:var(--amber);text-shadow:3px 3px 0 #000;margin-top:6px}
.items{display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%}
.item{font-family:var(--px);font-size:clamp(32px,5vw,48px);line-height:1.15;color:var(--red);text-shadow:0 4px 0 var(--red-lo),4px 4px 0 #000;background:none;border:0;padding:0 0 0 1.3em;margin:0;position:relative;cursor:pointer;text-align:left;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:0 .6em;align-items:baseline;max-width:100%}
.items.sm .item{font-size:clamp(20px,3vw,32px)}
.item.sel{color:var(--red-hi)}
.item.sel::before{content:"";position:absolute;left:0;top:.08em;width:.95em;height:.95em;background:var(--skull) center/contain no-repeat;image-rendering:pixelated}
.item .val{color:var(--bone);text-shadow:3px 3px 0 #000}
.item .val::before{content:"< ";color:var(--dim)}
.item .val::after{content:" >";color:var(--dim)}
.desc{font-size:clamp(16px,2.2vw,24px);min-height:2.6em;max-width:46ch;color:var(--bone);text-shadow:2px 2px 0 #000;line-height:1.3}
.stats{display:flex;flex-direction:column;gap:4px;width:min(620px,100%);font-size:clamp(20px,3vw,32px)}
.stat{display:flex;gap:.5em;color:var(--red);text-shadow:3px 3px 0 #000;text-transform:uppercase}
.stat .dots{flex:1;overflow:hidden;white-space:nowrap;color:var(--plate-hi);text-shadow:none}
.stat .dots::before{content:"........................................................................................"}
.stat b{font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:auto auto;gap:6px 32px;text-align:left;font-size:clamp(16px,2.4vw,24px);text-shadow:2px 2px 0 #000}
.ctl .k{color:var(--amber);text-align:right}
.ufoot{font-size:16px;color:var(--dim);text-shadow:2px 2px 0 #000}
.uhint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:16px;color:var(--dim);text-shadow:2px 2px 0 #000;pointer-events:none}
.over-hud .uhint{display:none}
.w0{color:var(--amber)}.w1{color:#ff8a3a}.w2{color:var(--plasma)}.w-1{color:var(--toxic)}
#menu-note{position:absolute;left:16px;right:16px;bottom:calc(48px + env(safe-area-inset-bottom,0px));text-align:center;font-size:16px;color:var(--amber);z-index:21;text-shadow:2px 2px 0 #000}
@media (max-height:560px){#ui{gap:10px}.item{font-size:28px}.uihead{font-size:36px}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="view"></canvas>
  <div id="fx-low"></div><div id="fx-dmg"></div><div id="fx-pick"></div>
  <div id="crosshair" hidden></div>
  <button class="menu-btn" id="btn-menu" type="button" hidden><span data-i="menuBtn">МЕНЮ</span><span class="k">ESC</span></button>
  <div id="msgs"></div>
  <div id="bossbar" hidden><div class="name" id="boss-name"></div><div class="track"><div class="fill" id="boss-fill"></div></div></div>
  <canvas id="minimap" hidden></canvas>
  <div id="banner"><div class="t" id="banner-t"></div><div class="s" id="banner-s"></div></div>

  <div id="hud" hidden>
    <div class="cell"><div class="big" id="h-ammo">--</div><div class="lbl" data-i="hAmmo">ПАТРОНЫ</div></div>
    <div class="cell"><div class="big" id="h-hp">100%</div><div class="lbl" data-i="hHp">ЗДОРОВЬЕ</div></div>

    <div class="cell"><div class="big" id="h-armor">0%</div><div class="lbl" data-i="hArmor">БРОНЯ</div></div>
    <div class="cell arms"><div class="slots"><span id="s0">1</span><span id="s1">2</span><span id="s2">3</span></div><div class="lbl" id="h-wname"></div></div>
    <div class="cell"><div class="mid" id="h-level"></div><div class="small" id="h-kills"></div><div class="small" id="h-res"></div></div>
  </div>

  <section id="ui" hidden></section>
  <canvas id="melt" hidden></canvas>
  <div id="menu-note" hidden></div>
  <div id="crt"></div>
</div>

function rayWall(ox,oz,dx,dz,maxT){
  let cx=Math.floor(ox/CELL), cz=Math.floor(oz/CELL);
  const sx=dx>0?1:-1, sz=dz>0?1:-1;
  const tdx=dx!==0?Math.abs(CELL/dx):Infinity, tdz=dz!==0?Math.abs(CELL/dz):Infinity;
  let tmx=dx>0?((cx+1)*CELL-ox)/dx:dx<0?(cx*CELL-ox)/dx:Infinity;
  let tmz=dz>0?((cz+1)*CELL-oz)/dz:dz<0?(cz*CELL-oz)/dz:Infinity;
  let t=0;
  for(let n=0;n<200;n++){
    if(tmx<tmz){ cx+=sx; t=tmx; tmx+=tdx; } else { cz+=sz; t=tmz; tmz+=tdz; }
    if(t>maxT) return maxT;
    if(isWall(cx,cz)) return t;
  }
  return maxT;
}

function clearPath(ax,az,bx,bz,r){
  const dx=bx-ax, dz=bz-az, d=Math.hypot(dx,dz); if(d<0.01) return true;
  const ux=dx/d, uz=dz/d, px=-uz*r, pz=ux*r;
  return rayWall(ax,az,ux,uz,d)>=d-0.01 && rayWall(ax+px,az+pz,ux,uz,d)>=d-0.01 && rayWall(ax-px,az-pz,ux,uz,d)>=d-0.01;
}
function rayCircle(ox,oz,dx,dz,cx,cz,r){
  const fx=ox-cx, fz=oz-cz, b=fx*dx+fz*dz, c=fx*fx+fz*fz-r*r;
  if(c<0) return 0;
  const disc=b*b-c; if(disc<0) return -1;
  const t=-b-Math.sqrt(disc); return t>=0?t:-1;
}

class MB{
  constructor(){ this.p=[]; this.n=[]; this.c=[]; }
  add(geo,pos,rot,color,jit=0.16){
    const g=geo.index?geo.toNonIndexed():geo; if(g!==geo) geo.dispose();
    const m=new T.Matrix4().makeRotationFromEuler(new T.Euler(rot?rot[0]:0,rot?rot[1]:0,rot?rot[2]:0));
    m.setPosition(pos[0],pos[1],pos[2]); g.applyMatrix4(m);
    const pa=g.attributes.position.array, na=g.attributes.normal.array, col=new T.Color(color);
    for(let i=0;i<pa.length;i+=9){
      const f=1-Math.random()*jit;
      for(let k=0;k<9;k++){ this.p.push(pa[i+k]); this.n.push(na[i+k]); }
      for(let v=0;v<3;v++) this.c.push(col.r*f,col.g*f,col.b*f);
    }
    g.dispose(); return this;
  }
  box(w,h,d,pos,rot,color,jit){ return this.add(new T.BoxGeometry(w,h,d),pos,rot,color,jit); }
  cone(r,h,seg,pos,rot,color,jit){ return this.add(new T.ConeGeometry(r,h,seg),pos,rot,color,jit); }
  cyl(rt,rb,h,seg,pos,rot,color,jit){ return this.add(new T.CylinderGeometry(rt,rb,h,seg),pos,rot,color,jit); }
  sph(r,pos,color,sx=1,sy=1,sz=1,jit,ws=8,hs=6){ const g=new T.SphereGeometry(r,ws,hs); g.scale(sx,sy,sz); return this.add(g,pos,null,color,jit); }
  tor(r,t,pos,rot,color,jit){ return this.add(new T.TorusGeometry(r,t,6,14),pos,rot,color,jit); }
  get empty(){ return this.p.length===0; }
  geo(){ const g=new T.BufferGeometry(); g.setAttribute('position',new T.Float32BufferAttribute(this.p,3)); g.setAttribute('normal',new T.Float32BufferAttribute(this.n,3)); g.setAttribute('color',new T.Float32BufferAttribute(this.c,3)); g.computeBoundingSphere(); return g; }
}

function buildWorld(){
  const mats=[texBrick,texTech,texBloody].map(t=>new T.MeshPhongMaterial({map:t,shininess:8,specular:0x141210,side:T.DoubleSide}));
  const bufs=[0,1,2].map(()=>({p:[],n:[],u:[]}));
  const vh=WALL_H/CELL;
  function quad(b,ax,az,bx,bz,nx,nz){
    const P=[[ax,0,az],[bx,0,bz],[bx,WALL_H,bz],[ax,0,az],[bx,WALL_H,bz],[ax,WALL_H,az]];
    const U=[[0,0],[1,0],[1,vh],[0,0],[1,vh],[0,vh]];
    for(let k=0;k<6;k++){ b.p.push(...P[k]); b.n.push(nx,0,nz); b.u.push(...U[k]); }
  }
  for(let z=0;z<MH;z++) for(let x=0;x<MW;x++){
    if(!isWall(x,z)) continue;
    const h=((x*73856093)^(z*19349663))>>>0;
    const v=h%5===0?1:h%7===0?2:0;
    const x0=x*CELL,x1=x0+CELL,z0=z*CELL,z1=z0+CELL, b=bufs[v];
    if(!isWall(x+1,z)) quad(b,x1,z1,x1,z0,1,0);
    if(!isWall(x-1,z)) quad(b,x0,z0,x0,z1,-1,0);
    if(!isWall(x,z+1)) quad(b,x0,z1,x1,z1,0,1);
    if(!isWall(x,z-1)) quad(b,x1,z0,x0,z0,0,-1);
  }
  bufs.forEach((b,i)=>{
    if(!b.p.length) return;
    const g=new T.BufferGeometry();
    g.setAttribute('position',new T.Float32BufferAttribute(b.p,3));
    g.setAttribute('normal',new T.Float32BufferAttribute(b.n,3));
    g.setAttribute('uv',new T.Float32BufferAttribute(b.u,2));
    scene.add(new T.Mesh(g,mats[i]));
  });
  texFloor.repeat.set(MW,MH); texCeil.repeat.set(MW,MH);

const PVS=`attribute float psize; attribute vec4 pcol; varying vec4 vC; uniform float uScale;
void main(){ vC=pcol; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=clamp(psize*uScale/max(0.1,-mv.z),1.0,300.0); gl_Position=projectionMatrix*mv; }`;
const PFS=`varying vec4 vC; uniform float uHard;
void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d)*2.0; if(r>1.0) discard; float a=mix(pow(1.0-r,1.5),1.0-smoothstep(0.55,1.0,r),uHard); gl_FragColor=vec4(vC.rgb,vC.a*a); }`;
function colorize(kind,k,col,o){
  let r=1,g=1,b=1,a=1;
  switch(kind){
    case 0: if(k<0.15){r=1;g=0.95;b=0.7;} else if(k<0.5){const u=(k-0.15)/0.35;r=1;g=0.95-0.55*u;b=0.7-0.62*u;} else {const u=(k-0.5)/0.5;r=1-0.62*u;g=0.4-0.36*u;b=0.08;} a=(1-k)*0.85; break;
    case 1: r=0.35+0.6*(1-k); g=0.75+0.25*(1-k); b=1; a=1-k; break;
    case 2: r=1; g=0.85-0.45*k; b=0.4-0.35*k; a=1-k; break;
    case 3: r=0.45; g=1; b=0.18; a=(1-k)*0.9; break;
    case 4: r=1; g=0.6-0.45*k; b=0.15; a=1-k; break;
    case 5: r=0.3; g=1; b=0.55; a=(1-k)*0.8; break;
    case 6: r=1; g=0.9; b=0.6; a=1-k; break;
    case 10: r=0.4; g=0.02; b=0.02; a=k<0.7?1:(1-k)/0.3; break;
    case 11: r=g=b=0.11; a=0.5*(1-k); break;
    case 12: r=0.36; g=0.05; b=0.04; a=k<0.85?1:(1-k)/0.15; break;
    case 13: r=0.22; g=0.18; b=0.14; a=0.55*(1-k); break;
  }
  col[o]=r; col[o+1]=g; col[o+2]=b; col[o+3]=a;
}
class PSys{
  constructor(n,additive){
    this.n=n; this.c=0;
    this.pos=new Float32Array(n*3); this.col=new Float32Array(n*4); this.sz=new Float32Array(n);
    this.vel=new Float32Array(n*3); this.age=new Float32Array(n); this.life=new Float32Array(n); this.kind=new Uint8Array(n);
    this.s0=new Float32Array(n); this.s1=new Float32Array(n); this.gr=new Float32Array(n); this.dr=new Float32Array(n);
    const g=new T.BufferGeometry();
    this.aPos=new T.BufferAttribute(this.pos,3).setUsage(T.DynamicDrawUsage);
    this.aCol=new T.BufferAttribute(this.col,4).setUsage(T.DynamicDrawUsage);
    this.aSz=new T.BufferAttribute(this.sz,1).setUsage(T.DynamicDrawUsage);
    g.setAttribute('position',this.aPos); g.setAttribute('pcol',this.aCol); g.setAttribute('psize',this.aSz); g.setDrawRange(0,0);
    this.mat=new T.ShaderMaterial({uniforms:{uScale:{value:300},uHard:{value:additive?0:1}},vertexShader:PVS,fragmentShader:PFS,transparent:true,depthWrite:false,blending:additive?T.AdditiveBlending:T.NormalBlending});
    this.pts=new T.Points(g,this.mat); this.pts.frustumCulled=false; this.pts.renderOrder=additive?3:2; this.geo=g; scene.add(this.pts);
  }
  add(kind,x,y,z,vx,vy,vz,life,s0,s1,gr=0,dr=0){
    const i=this.c<this.n?this.c++:(Math.random()*this.n)|0, i3=i*3;
    this.pos[i3]=x; this.pos[i3+1]=y; this.pos[i3+2]=z; this.vel[i3]=vx; this.vel[i3+1]=vy; this.vel[i3+2]=vz;
    this.age[i]=0; this.life[i]=life; this.kind[i]=kind; this.s0[i]=s0; this.s1[i]=s1; this.gr[i]=gr; this.dr[i]=dr; this.sz[i]=s0;
    colorize(kind,0,this.col,i*4);
  }
  copy(f,t){
    const f3=f*3,t3=t*3,f4=f*4,t4=t*4;
    for(let k=0;k<3;k++){ this.pos[t3+k]=this.pos[f3+k]; this.vel[t3+k]=this.vel[f3+k]; }
    for(let k=0;k<4;k++) this.col[t4+k]=this.col[f4+k];
    this.age[t]=this.age[f]; this.life[t]=this.life[f]; this.kind[t]=this.kind[f]; this.s0[t]=this.s0[f]; this.s1[t]=this.s1[f]; this.gr[t]=this.gr[f]; this.dr[t]=this.dr[f]; this.sz[t]=this.sz[f];
  }
  update(dt){
    let i=0;
    while(i<this.c){
      this.age[i]+=dt;
      if(this.age[i]>=this.life[i]){ this.c--; if(i!==this.c) this.copy(this.c,i); continue; }
      const i3=i*3, k=this.age[i]/this.life[i], dr=Math.exp(-this.dr[i]*dt);
      this.vel[i3]*=dr; this.vel[i3+2]*=dr; this.vel[i3+1]=this.vel[i3+1]*dr-this.gr[i]*dt;
      let nx=this.pos[i3]+this.vel[i3]*dt, ny=this.pos[i3+1]+this.vel[i3+1]*dt, nz=this.pos[i3+2]+this.vel[i3+2]*dt;
      if(wallAt(nx,nz)){ this.vel[i3]=0; this.vel[i3+2]=0; nx=this.pos[i3]; nz=this.pos[i3+2]; }
      if(ny<0.05){ ny=0.05; this.vel[i3+1]=0; this.vel[i3]*=0.4; this.vel[i3+2]*=0.4; }
      else if(ny>WALL_H-0.1){ ny=WALL_H-0.1; this.vel[i3+1]=0; }
      this.pos[i3]=nx; this.pos[i3+1]=ny; this.pos[i3+2]=nz;
      this.sz[i]=this.s0[i]+(this.s1[i]-this.s0[i])*k;
      colorize(this.kind[i],k,this.col,i*4);
      i++;
    }
    this.aPos.needsUpdate=this.aCol.needsUpdate=this.aSz.needsUpdate=true;
    this.geo.setDrawRange(0,this.c);
  }
  clear(){ this.c=0; this.geo.setDrawRange(0,0); }
}

const AU={ ctx:null, master:null, noise:null, flameGain:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      const c=this.ctx=new C();
      this.master=c.createGain(); this.master.gain.value=S.sound?0.6:0;
      const comp=c.createDynamicsCompressor(); this.master.connect(comp); comp.connect(c.destination);
      const len=c.sampleRate, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=buf;
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100;
      this.flameGain=c.createGain(); this.flameGain.gain.value=0;
      src.connect(lp); lp.connect(this.flameGain); this.flameGain.connect(this.master); src.start();
      const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=170;
      const dg=c.createGain(); dg.gain.value=0.07; dl.connect(dg); dg.connect(this.master);
      [55,55.6,82.5].forEach(f=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(dl); o.start(); });
      const lfo=c.createOscillator(); lfo.frequency.value=0.06; const lg=c.createGain(); lg.gain.value=80; lfo.connect(lg); lg.connect(dl.frequency); lfo.start();
    }catch(e){ this.ctx=null; }
  },
  setOn(v){ if(this.master) this.master.gain.value=v?0.6:0; },
  vol(x,z){ return x===undefined?1:Math.max(0,1-Math.hypot(x-player.x,z-player.z)/60); },
  nz(dur,f,q,v,type,f2,delay=0){
    const c=this.ctx; if(!c||v<=0.005) return; const t=c.currentTime+delay;
    const s=c.createBufferSource(); s.buffer=this.noise;
    const fl=c.createBiquadFilter(); fl.type=type||'bandpass'; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);
  },
  tn(f0,f1,dur,v,wave,delay=0){
    const c=this.ctx; if(!c||v<=0.005) return; const t=c.currentTime+delay;
    const o=c.createOscillator(); o.type=wave||'square'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  pistol(){ this.nz(0.2,2000,0.7,0.75,'bandpass',260); this.tn(170,40,0.13,0.5,'triangle'); },
  plasma(){ this.tn(1500,240,0.13,0.16,'sawtooth'); this.nz(0.07,5000,1,0.12,'highpass'); },
  zap(x,z){ const v=this.vol(x,z); this.nz(0.25,1800,1,v*0.35,'bandpass',300); this.tn(400,80,0.2,v*0.15,'square'); },
  boom(x,z,big){ const v=this.vol(x,z); this.nz(big?1.4:0.7,700,0.5,v*(big?1:0.7),'lowpass',50); this.tn(100,28,big?0.7:0.35,v*0.7,'sine'); },
  splat(x,z){ const v=this.vol(x,z); this.nz(0.18,600,1.4,v*0.5,'bandpass',180); },
  hit(x,z){ const v=this.vol(x,z); this.nz(0.08,900,2,v*0.25,'bandpass'); },
  groan(x,z,pitch=1,gain=0.35){
    const c=this.ctx; if(!c) return; const v=this.vol(x,z)*gain; if(v<=0.02) return;
    const t=c.currentTime, dur=0.7+Math.random()*0.8, f=(70+Math.random()*40)*pitch;
    const o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*0.7,t+dur);
    const fl=c.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=4; fl.frequency.setValueAtTime(380,t); fl.frequency.linearRampToValueAtTime(800+Math.random()*500,t+dur*0.4); fl.frequency.linearRampToValueAtTime(280,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.1); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const lfo=c.createOscillator(); lfo.frequency.value=8+Math.random()*9; const lg=c.createGain(); lg.gain.value=f*0.18; lfo.connect(lg); lg.connect(o.frequency);
    o.connect(fl); fl.connect(g); g.connect(this.master); o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
  },
  roar(x,z){ this.groan(x,z,0.42,0.6); this.groan(x,z,0.55,0.5); this.nz(1.6,320,1,this.vol(x,z)*0.5,'lowpass',70); },
  slash(x,z){ const v=this.vol(x,z); this.nz(0.15,2500,1,v*0.4,'bandpass',800); },
  hurt(){ this.tn(320,110,0.25,0.35,'square'); this.nz(0.2,900,1,0.3); },
  pick(){ this.tn(520,900,0.08,0.18,'square'); this.tn(900,1400,0.1,0.18,'square',0.07); },
  portal(){ [261,329,392,523].forEach((f,i)=>this.tn(f,f*1.01,0.9,0.12,'triangle',i*0.09)); },
  spit(x,z){ const v=this.vol(x,z); this.nz(0.3,1300,3,v*0.45,'bandpass',300); },
  dry(){ this.tn(300,200,0.05,0.2,'square'); },
  menuMove(){ this.nz(0.05,1700,1.2,0.3,'bandpass'); this.tn(240,170,0.04,0.12,'square'); },
  menuSel(){ this.pistol(); },
  menuBack(){ this.tn(170,80,0.09,0.22,'square'); },
  tick(){ this.tn(1250,1250,0.025,0.07,'square'); },
  swap(){ this.nz(0.1,3000,2,0.2,'bandpass'); },
  flame(on){ if(!this.flameGain) return; this.flameGain.gain.setTargetAtTime(on?0.5:0,this.ctx.currentTime,0.05); }

function makeZombieMesh(G,boss){
  const mat=new T.MeshPhongMaterial({vertexColors:true,flatShading:true,shininess:6,specular:0x1a1a1a});

  const root=new T.Group(); root.rotation.order='YXZ';
  const hip=new T.Group(); hip.position.y=G.hipY; root.add(hip);
  const legL=new T.Mesh(G.leg,mat); legL.position.x=-G.hipX; hip.add(legL);
  const legR=new T.Mesh(G.leg,mat); legR.position.x=G.hipX; hip.add(legR);
  const torso=new T.Mesh(G.torso,mat); torso.rotation.x=G.lean; hip.add(torso);
  if(G.torsoGlow) torso.add(new T.Mesh(G.torsoGlow,glow));
  const head=new T.Group(); head.position.set(...G.neck); torso.add(head);
  head.add(new T.Mesh(G.head,mat)); head.add(new T.Mesh(G.headGlow,glow));
  const jaw=new T.Mesh(G.jaw,mat); jaw.position.set(...G.jawPos); head.add(jaw);
  const armL=new T.Mesh(G.armL,mat); armL.position.set(-G.shX,G.shY,0); torso.add(armL);
  const armR=new T.Mesh(G.armR,mat); armR.position.set(G.shX,G.shY,0); torso.add(armR);
  return {root,hip,legL,legR,torso,head,jaw,armL,armR,mat,glow};
}

// ---------- flow field ----------
const flow=new Int16Array(MW*MH).fill(-1); let flowCell=-1;
const fq=new Int32Array(MW*MH);
function updateFlow(){
  const pc=Math.floor(player.z/CELL)*MW+Math.floor(player.x/CELL);
  if(pc===flowCell) return; flowCell=pc;
  flow.fill(-1); let h=0,t=0; fq[t++]=pc; flow[pc]=0;
  while(h<t){ const c=fq[h++], cx=c%MW, cz=(c/MW)|0, d=flow[c]+1;
    if(cx+1<MW&&!grid[c+1]&&flow[c+1]<0){flow[c+1]=d;fq[t++]=c+1;}
    if(cx>0&&!grid[c-1]&&flow[c-1]<0){flow[c-1]=d;fq[t++]=c-1;}
    if(cz+1<MH&&!grid[c+MW]&&flow[c+MW]<0){flow[c+MW]=d;fq[t++]=c+MW;}
    if(cz>0&&!grid[c-MW]&&flow[c-MW]<0){flow[c-MW]=d;fq[t++]=c-MW;}
  }
}
function nav(z,d){
  z.los=d<60 && clearPath(z.x,z.z,player.x,player.z,z.r*0.85);
  if(z.los){ z.tx=player.x; z.tz=player.z; return; }
  const cx=Math.floor(z.x/CELL), cz=Math.floor(z.z/CELL);
  let bd=flow[cz*MW+cx]; if(bd<0) bd=9999; let bx=-1,bz=-1;
  for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dz) continue; const nx=cx+dx, nz=cz+dz;
    if(isWall(nx,nz)) continue;
    if(dx&&dz&&(isWall(cx+dx,cz)||isWall(cx,cz+dz))) continue;
    const f=flow[nz*MW+nx]; if(f>=0&&f<bd){ bd=f; bx=nx; bz=nz; }
  }
  if(bx<0){ z.tx=player.x; z.tz=player.z; return; }
  const [tx,tz]=center([bx,bz]);
  // pull toward the cell centre line so wide bodies clear door frames
  z.tx=tx; z.tz=tz;
}

// ---------- player helpers ----------
function blockP(nx,nz){
  if(boxHitsWall(nx,nz,PR)) return true;
  for(const z of zombies){ if(z.dead||z.rise>0) continue; const rr=z.r+PR, dn=(nx-z.x)**2+(nz-z.z)**2; if(dn<rr*rr && dn<(player.x-z.x)**2+(player.z-z.z)**2) return true; }
  for(const b of barrels){ if(b.dead) continue; const rr=b.r+PR, dn=(nx-b.x)**2+(nz-b.z)**2; if(dn<rr*rr && dn<(player.x-b.x)**2+(player.z-b.z)**2) return true; }
  return false;
}
function moveP(){
  const p=player, n=Math.max(1,Math.ceil(Math.max(Math.abs(p.momx),Math.abs(p.momz))/0.2)), sx=p.momx/n, sz=p.momz/n;
  let bx=false,bz=false;
  for(let i=0;i<n;i++){
    if(!bx){ if(!blockP(p.x+sx,p.z)) p.x+=sx; else { bx=true; p.momx=0; } }
    if(!bz){ if(!blockP(p.x,p.z+sz)) p.z+=sz; else { bz=true; p.momz=0; } }
  }
}
const keys={}; let mouseDown=false;
function playerTic(){
  const p=player; p.px=p.x; p.pz=p.z; p.tic++;
  if(p.dead){ p.momx*=FRICTION; p.momz*=FRICTION; moveP(); return; }
  const run=!(keys.ShiftLeft||keys.ShiftRight);
  let fwd=0, side=0, turn=0;
  if(keys.KeyW||keys.ArrowUp) fwd+=1;
  if(keys.KeyS||keys.ArrowDown) fwd-=1;
  if(S.ctrl==='classic'){ if(keys.KeyA) turn+=1; if(keys.KeyD) turn-=1; if(keys.KeyQ) side-=1; if(keys.KeyE) side+=1; }
  else { if(keys.KeyA) side-=1; if(keys.KeyD) side+=1; }
  if(keys.ArrowLeft) turn+=1; if(keys.ArrowRight) turn-=1;
  if(turn){ p.turnHeld++; const at=p.turnHeld<6?320:(run?1280:640); p.yaw+=turn*at/65536*TAU; } else p.turnHeld=0;
  // Doom: forwardmove 25/50, sidemove 24/40, thrust = move*2048 (fixed point), no normalisation (strafe-running is faster)
  const fm=fwd*(run?50:25), sm=side*(run?40:24), th=2048/65536*K;
  const fx=-Math.sin(p.yaw), fz=-Math.cos(p.yaw), rx=Math.cos(p.yaw), rz=-Math.sin(p.yaw);
  p.momx+=(fx*fm+rx*sm)*th; p.momz+=(fz*fm+rz*sm)*th;
  moveP();
  p.momx*=FRICTION; p.momz*=FRICTION;
  if(!fwd&&!side&&Math.abs(p.momx)<STOP&&Math.abs(p.momz)<STOP){ p.momx=0; p.momz=0; }
  const md=Math.hypot(p.momx,p.momz)/K;
  p.bob=Math.min(16,md*md/4);
}
function hurtPlayer(dmg,sx,sz){
  const p=player; if(p.dead||dmg<=0) return;
  dmg=Math.round(dmg*SK().dmg);
  if(p.armor>0){ const a=Math.min(p.armor,Math.floor(dmg/3)); p.armor-=a; dmg-=a; }
  p.hp-=dmg; p.hurtT=0.5;
  const dx=p.x-sx, dz=p.z-sz, d=Math.hypot(dx,dz)||1;
  const thrust=dmg/8*K;
  p.momx+=dx/d*thrust; p.momz+=dz/d*thrust;
  // which side did it come from (for the face)
  const fx=-Math.sin(p.yaw), fz=-Math.cos(p.yaw), cross=fx*(-dz)-fz*(-dx);
  p.lookDir=Math.abs(cross/d)<0.35?0:(cross>0?-1:1); p.lookT=1;
  fxDmg=Math.min(1,fxDmg+0.25+dmg/40);
  shake(Math.min(0.5,dmg/60));
  AU.hurt();
  if(p.hp<=0){ p.hp=0; p.dead=true; p.deadT=0; AU.flame(false); AU.groan(p.x,p.z,0.8,0.5); }
}

function selectWeapon(i){

  if(i===p.weapon && p.switchT<=0) return;
  if(i===1&&p.fuel<=0){ msg(tr('noFuel'),'#ff9a4a'); AU.dry(); return; }
  if(i===2&&p.cells<=0){ msg(tr('noCells'),'#5fd8ff'); AU.dry(); return; }

}
function muzzlePos(side){
  const p=player, fx=-Math.sin(p.yaw), fz=-Math.cos(p.yaw), rx=Math.cos(p.yaw), rz=-Math.sin(p.yaw);
  return [p.x+fx*0.9+rx*0.2*side, EYE-0.3, p.z+fz*0.9+rz*0.2*side];
}
function hitscan(ox,oz,dx,dz,range,dmg,pen){
  const wt=rayWall(ox,oz,dx,dz,range), hits=[];
  for(const z of zombies){ if(z.dead||z.rise>0) continue; const t=rayCircle(ox,oz,dx,dz,z.x,z.z,z.r*1.1); if(t>=0&&t<wt) hits.push([t,z]); }
  for(const b of barrels){ if(b.dead) continue; const t=rayCircle(ox,oz,dx,dz,b.x,b.z,b.r); if(t>=0&&t<wt) hits.push([t,b]); }
  hits.sort((a,b)=>a[0]-b[0]);
  let n=0;
  for(const [t,o] of hits){
    if(n>=pen) break;
    const hx=ox+dx*t, hz=oz+dz*t;
    if(o.isBarrel){ hurtBarrel(o,dmg); sparks(hx,1,hz,6); return; }
    blood(hx,o.hgt*rand(0.5,0.75),hz,6,3.5); AU.hit(hx,hz);
    damageZombie(o,dmg,'bullet',ox,oz); n++;
  }
  if(n<pen && wt<range){ const hx=ox+dx*(wt-0.05), hz=oz+dz*(wt-0.05); sparks(hx,EYE-0.2+sp()*0.3,hz,8); }
}
function firePistol(){
  const p=player, u=p.up, dual=u.dual>0;
  const dmg=20*(1+0.35*u.pDmg);
  p.cool=0.27/(1+0.25*u.pRate)*(dual?0.55:1);
  const side=dual?(p.hand^=1):0;
  const spread=0.014+Math.min(0.03,Math.hypot(p.momx,p.momz)*0.02);
  const a=p.yaw+rand(-spread,spread);
  hitscan(p.x,p.z,-Math.sin(a),-Math.cos(a),100,dmg,1+u.pierce);
  const g=WEAP[0].guns[side?1:0]; g.flash.visible=true; g.flashT=0.06; g.flash.material.rotation=Math.random()*TAU;
  p.recoil[side?1:0]=1;
  const [mx,my,mz]=muzzlePos(side?-1:1);
  muzzleLight.color.setHex(0xffb060); muzzleLight.intensity=2.6; muzzleLight.position.set(mx,my,mz);
  wMuz.color.setHex(0xffaa55); wMuz.intensity=2.5;
  AU.pistol(); noise(9);
}
function fireFlame(){

  for(let i=0;i<4;i++){ const f=rand(0.8,1.05); fxA.add(0,mx+fx*0.1,my+sp()*0.05,mz+fz*0.1,vx*f+sp()*1.5,rand(0,1.6),vz*f+sp()*1.5,rand(0.4,0.58),0.3,rand(1.8,2.6)*Math.sqrt(range),-1.5,0.9); }
  if(Math.random()<0.3) fxN.add(11,mx+dx*8,my+0.5,mz+dz*8,vx*0.2,1.5,vz*0.2,1.2,0.6,2.2,-0.4,0.8);
  muzzleLight.color.setHex(0xff7a20); muzzleLight.intensity=2+Math.random(); muzzleLight.position.set(mx+dx*3,my,mz+dz*3);

function firePlasma(){
  const p=player, u=p.up;

  muzzleLight.color.setHex(0x60c8ff); muzzleLight.intensity=2.4; muzzleLight.position.set(mx,my,mz);

function outOfAmmo(key){ msg(tr(key),'#f2a531'); AU.dry(); AU.flame(false); selectWeapon(0); }
function weaponUpdate(dt){
  const p=player;
  p.cool-=dt; p.recoil[0]=Math.max(0,p.recoil[0]-dt*7); p.recoil[1]=Math.max(0,p.recoil[1]-dt*7);
  for(const g of WEAP[0].guns) if(g.flashT>0&&(g.flashT-=dt)<=0) g.flash.visible=false;
  for(const w of [WEAP[1],WEAP[2]]) if(w.flashT>0&&(w.flashT-=dt)<=0) w.flash.visible=false;
  if(p.switchT>0){
    p.switchT-=dt;
    if(!p.swapped&&p.switchT<=0.16){ p.swapped=true; WEAP[p.weapon].root.visible=false; p.weapon=p.nextWeapon; WEAP[p.weapon].root.visible=true; }
    if(p.switchT<=0) p.switchT=0;
    AU.flame(false); return;
  }
  const firing=(keys.Space||mouseDown)&&!p.dead&&S.mode==='play';
  if(p.weapon===1){ AU.flame(firing&&p.fuel>0); WEAP[1].pilot.scale.setScalar((firing?0.2:0.12)*(0.8+Math.random()*0.4)); }
  if(!firing||p.cool>0) return;
  if(p.weapon===0) firePistol(); else if(p.weapon===1) fireFlame(); else firePlasma();
}

// ---------- damage ----------
function damageZombie(z,dmg,kind,sx,sz){
  if(z.dead||z.rise>0) return;
  z.hp-=dmg; z.flash=0.1; wake(z);
  const dx=z.x-sx, dz=z.z-sz, d=Math.hypot(dx,dz)||1;
  const thrust=Math.min(12,dmg*100/z.mass*0.25);
  z.kx+=dx/d*thrust; z.kz+=dz/d*thrust;
  if(z.hp<=0){ killZombie(z,kind,dmg); return; }
  if(kind!=='burn' && !z.boss && Math.random()<0.35){ z.pain=0.2; if(z.act==='melee'&&Math.random()<0.5) z.act=null; }
}
function killZombie(z,kind,dmg){
  z.dead=true; z.deathT=0; z.act=null; S.kills++; S.score+=Math.round(z.score*S.level*SK().score);
  const y=z.hgt*0.55;
  const gib=!z.boss && (kind==='plasma'||kind==='blast') && (dmg>z.maxHp*0.45||Math.random()<0.35);
  if(kind==='flame'||kind==='burn'){ z.charred=true; z.mat.color.setHex(0x3a2a24); z.burnT=Math.max(z.burnT,1.5); }
  if(gib){ z.gone=true; z.root.visible=false; gibs(z.x,y,z.z,14+(z.type==='brute'?10:0)); decal(z.x,z.z,3.2*z.scale); AU.splat(z.x,z.z); }
  else { blood(z.x,y,z.z,14,4); decal(z.x,z.z,2.4*z.scale); AU.groan(z.x,z.z,z.boss?0.4:0.7,0.4); }
  if(z.boss){
    const bonus=Math.round(5000*S.level*SK().score); S.score+=bonus; player.grinT=2.5;
    showBanner(tr('bossDown',bossName(z)),tr('pts',bonus));
    for(let i=0;i<5;i++) setTimeout(()=>{ if(S.mode==='play'||S.mode==='menu') { explosionFx(z.x+sp()*2,z.z+sp()*2,4); gibs(z.x,3,z.z,10); AU.boom(z.x,z.z,true);} },i*220);
    spawnPickup('med',z.x+1.5,z.z,true); spawnPickup('armor',z.x-1.5,z.z,true); spawnPickup('cells',z.x,z.z+1.5,true); spawnPickup('fuel',z.x,z.z-1.5,true);
  } else {
    const r=Math.random();
    if(r<0.12) spawnPickup('stim',z.x,z.z,true);
    else if(r<0.24) spawnPickup('cells',z.x,z.z,true);
    else if(r<0.34) spawnPickup('fuel',z.x,z.z,true);
    if(Math.random()<0.25) player.grinT=0.8;
  }
  checkExit();
}
function hurtBarrel(b,dmg){ if(b.dead) return; b.hp-=dmg; if(b.hp<=0){ b.dead=true; b.fuse=0.12; } }
function explode(x,z,R,dmg){
  explosionFx(x,z,R); AU.boom(x,z,true); decal(x,z,R*0.8);
  for(const zb of zombies){ if(zb.dead||zb.rise>0) continue; const d=Math.hypot(zb.x-x,zb.z-z)-zb.r; if(d<R&&los(x,z,zb.x,zb.z)) damageZombie(zb,dmg*(1-Math.max(0,d)/R),'blast',x,z); }
  const pd=Math.hypot(player.x-x,player.z-z)-PR;
  if(pd<R&&los(x,z,player.x,player.z)) hurtPlayer(dmg*0.6*(1-Math.max(0,pd)/R),x,z);
  for(const b of barrels){ if(!b.dead&&Math.hypot(b.x-x,b.z-z)<R) hurtBarrel(b,999); }
  noise(14);
}

// ---------- projectiles ----------
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i]; s.life-=dt;
    if(s.kind==='flame'){
      s.r+=dt*2.6; s.vx*=Math.exp(-dt*0.9); s.vz*=Math.exp(-dt*0.9);
      const nx=s.x+s.vx*dt, nz=s.z+s.vz*dt;
      if(wallAt(nx,nz)){ s.vx=0; s.vz=0; s.life=Math.min(s.life,0.12); } else { s.x=nx; s.z=nz; }
      for(const z of zombies){
        if(z.dead||z.rise>0||s.hit.has(z)) continue;
        if(Math.hypot(z.x-s.x,z.z-s.z)<z.r+s.r){ s.hit.add(z); z.burnT=3+player.up.fDmg*0.5; z.burnDps=Math.max(z.burnDps,s.burn); damageZombie(z,s.dmg,'flame',player.x,player.z); }
      }
      for(const b of barrels) if(!b.dead&&!s.hit.has(b)&&Math.hypot(b.x-s.x,b.z-s.z)<b.r+s.r){ s.hit.add(b); hurtBarrel(b,6); }
      if(s.life<=0) shots.splice(i,1);
      continue;
    }
    // plasma
    const steps=Math.max(1,Math.ceil(Math.hypot(s.vx,s.vz)*dt/0.35));
    let done=false, hitZ=null;
    for(let k=0;k<steps&&!done;k++){
      s.x+=s.vx*dt/steps; s.z+=s.vz*dt/steps;
      if(wallAt(s.x,s.z)){ s.x-=s.vx*dt/steps*0.5; s.z-=s.vz*dt/steps*0.5; done=true; break; }
      for(const z of zombies){ if(z.dead||z.rise>0) continue; if(Math.hypot(z.x-s.x,z.z-s.z)<z.r+s.r){ hitZ=z; done=true; break; } }
      if(!done) for(const b of barrels){ if(!b.dead&&Math.hypot(b.x-s.x,b.z-s.z)<b.r+s.r){ hurtBarrel(b,s.dmg); done=true; break; } }
    }
    if(!done){
      fxA.add(1,s.x,s.y,s.z,0,0,0,dt*1.5,1.1,1.1);
      fxA.add(1,s.x,s.y,s.z,sp()*0.5,sp()*0.5,sp()*0.5,0.18,0.45,0.05);
      if(s.life<=0) shots.splice(i,1);
      continue;
    }
    if(hitZ){ damageZombie(hitZ,s.dmg,'plasma',s.x-s.vx*0.01,s.z-s.vz*0.01); blood(s.x,s.y,s.z,4,3); }
    for(const z of zombies){ if(z===hitZ||z.dead||z.rise>0) continue; const d=Math.hypot(z.x-s.x,z.z-s.z)-z.r; if(d<s.splashR) damageZombie(z,s.splashDmg*(1-Math.max(0,d)/s.splashR),'plasma',s.x,s.z); }
    burst(1,s.x,s.y,s.z,16,5,0.35,0.35);
    flashLight(s.x,s.y,s.z,0x50c0ff,2.2,10+s.splashR*2,0.12);
    AU.zap(s.x,s.z);
    shots.splice(i,1);
  }
}
function fireEnemy(kind,x,y,z,tx,tz,spd,dmg){
  const dx=tx-x, dz=tz-z, d=Math.hypot(dx,dz)||1;
  eshots.push({kind,x,y,z,vx:dx/d*spd,vz:dz/d*spd,dmg,r:kind==='fire'?0.55:0.4,life:4});
}
function updateEShots(dt){
  for(let i=eshots.length-1;i>=0;i--){
    const s=eshots[i]; s.life-=dt;
    s.x+=s.vx*dt; s.z+=s.vz*dt;
    const pk=s.kind==='fire'?4:3;
    fxA.add(pk,s.x,s.y,s.z,0,0,0,dt*1.5,s.kind==='fire'?1.6:1.0,1);
    fxA.add(pk,s.x+sp()*0.1,s.y+sp()*0.1,s.z+sp()*0.1,sp()*0.6,sp()*0.6,sp()*0.6,0.3,0.5,0.1);
    let hit=false;
    if(wallAt(s.x,s.z)||s.life<=0) hit=true;
    else if(!player.dead&&Math.hypot(player.x-s.x,player.z-s.z)<PR+s.r){ hurtPlayer(s.dmg,s.x-s.vx,s.z-s.vz); hit=true; }
    if(hit){ burst(pk,s.x,s.y,s.z,14,4,0.45,0.4); if(s.kind==='fire'){ flashLight(s.x,s.y,s.z,0xff6020,2,10,0.2); AU.boom(s.x,s.z,false); } else AU.spit(s.x,s.z); eshots.splice(i,1); }
  }
}

// ---------- zombie AI ----------
function moveZ(z,dx,dz){
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dz))/0.3)), sx=dx/n, sz=dz/n, r=z.r*0.85;
  for(let i=0;i<n;i++){
    if(!boxHitsWall(z.x+sx,z.z,r)) z.x+=sx; else { z.vx*=0.5; z.kx=0; }
    if(!boxHitsWall(z.x,z.z+sz,r)) z.z+=sz; else { z.vz*=0.5; z.kz=0; }
  }
}
function startAct(z,kind,dur){ z.act=kind; z.actT=dur; z.actDur=dur; }
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*Math.min(1,t); }
function liveZ(z,dt,t){
  const P=z.parts, root=z.root;
  // hit flash / burning tint
  if(z.flash>0){ z.flash-=dt; const f=Math.max(0,z.flash)/0.1; z.mat.emissive.setRGB(0.8*f,0.75*f,0.7*f); }
  else if(z.burnT>0){ const f=0.25+Math.random()*0.2; z.mat.emissive.setRGB(f,f*0.35,0); }
  else z.mat.emissive.setRGB(0,0,0);
  if(z.burnT>0){
    z.burnT-=dt; z.burnAcc+=dt;
    for(let i=0;i<2;i++) fxA.add(0,z.x+sp()*z.r,rand(0.3,z.hgt*0.9),z.z+sp()*z.r,sp()*0.5,rand(1.5,3),sp()*0.5,rand(0.3,0.55),0.3*z.scale,1.1*z.scale,-1,1);
    if(z.burnAcc>=0.25){ z.burnAcc=0; damageZombie(z,z.burnDps*0.25,'burn',z.x,z.z); if(z.dead) return; }
  }
  if(z.pain>0) z.pain-=dt;
  if(z.rise>0){
    z.rise-=dt; root.position.set(z.x,-z.hgt*Math.max(0,z.rise)/1.2,z.z);
    if(Math.random()<0.4) fxN.add(13,z.x+sp()*z.r,0.1,z.z+sp()*z.r,sp(),rand(1,2),sp(),0.8,0.3,0.9,3,1);
    animZ(z,dt,t,0); return;
  }
  const dx=player.x-z.x, dz=player.z-z.z, d=Math.hypot(dx,dz);
  const kf=Math.exp(-dt*7); z.kx*=kf; z.kz*=kf;
  if(!z.awake){
    z.wakeT-=dt;
    if(z.wakeT<=0){ z.wakeT=0.3+Math.random()*0.2; const f=flow[Math.floor(z.z/CELL)*MW+Math.floor(z.x/CELL)]; if((f>=0&&f<=5)||(d<45&&los(z.x,z.z,player.x,player.z))) wake(z); }
    moveZ(z,z.kx*dt,z.kz*dt); root.position.set(z.x,0,z.z); root.rotation.y=z.yaw; animZ(z,dt,t,0); return;
  }
  z.cd-=dt; z.rcd-=dt; z.ccd-=dt; z.navT-=dt; z.groanT-=dt;
  if(z.groanT<=0){ z.groanT=rand(3,8); if(d<38) AU.groan(z.x,z.z,z.boss?0.45:z.type==='brute'?0.7:z.type==='runner'?1.3:1); }
  if(z.navT<=0){ z.navT=0.12+Math.random()*0.1; nav(z,d); }
  const skSpd=SK().spd; let spd=z.spd*skSpd*(z.pain>0?0.3:1);
  const reach=z.r+PR+(z.boss?1.4*z.scale:0.55*z.scale);
  if(z.act){
    z.actT-=dt;
    if(z.act==='charge'){
      spd=z.spd*skSpd*3.2;
      if(!z.chargeHit&&d<z.r+PR+0.5){ z.chargeHit=true; hurtPlayer(z.dmg*0.8,z.x,z.z); player.momx+=dx/d*0.6; player.momz+=dz/d*0.6; AU.slash(z.x,z.z); }
      if(boxHitsWall(z.x+z.cdx*0.6,z.z+z.cdz*0.6,z.r)) z.actT=0;
      if(Math.random()<0.5) fxN.add(13,z.x+sp(),0.2,z.z+sp(),sp(),1,sp(),0.7,0.5,1.4,0,1);
    } else spd*=0.12;
    if(z.actT<=0){
      const kind=z.act; z.act=null;
      if(kind==='melee'){
        z.cd=(z.boss?1.5:1.0)*SK().cd;
        if(d<reach+0.7&&!player.dead){ hurtPlayer(z.dmg,z.x,z.z); AU.slash(z.x,z.z); blood(player.x,EYE-0.4,player.z,6,3); }
        if(z.boss){ shake(0.6); for(let i=0;i<24;i++){ const a=i/24*TAU; fxN.add(13,z.x+Math.cos(a)*z.r*1.6,0.2,z.z+Math.sin(a)*z.r*1.6,Math.cos(a)*6,1.5,Math.sin(a)*6,0.8,0.6,1.6,3,2); } AU.boom(z.x,z.z,false); }
      } else if(kind==='spit'){
        z.rcd=rand(2.4,3.6)*SK().cd;
        const hx=z.x+Math.sin(z.yaw)*z.r, hz=z.z+Math.cos(z.yaw)*z.r;
        const lead=d/20; fireEnemy('acid',hx,z.hgt*0.82,hz,player.x+player.momx*35*lead*0.5,player.z+player.momz*35*lead*0.5,20,12*S.diff.dmg);
        AU.spit(z.x,z.z);
      } else if(kind==='volley'){
        z.rcd=rand(3,4.5)*SK().cd;
        const n=3+Math.min(4,S.level-4), spread=0.55;
        const base=Math.atan2(dx,dz);
        for(let i=0;i<n;i++){ const a=base+(n>1?(i/(n-1)-0.5)*spread:0); fireEnemy('fire',z.x+Math.sin(a)*z.r,z.hgt*0.55,z.z+Math.cos(a)*z.r,z.x+Math.sin(a)*100,z.z+Math.cos(a)*100,22+S.level,14*S.diff.dmg); }
        AU.boom(z.x,z.z,false); z.parts.glow.color.setScalar(1);
      } else if(kind==='charge'){ z.ccd=rand(5,8); }
    }
  } else if(!player.dead){
    if(d<reach&&z.cd<=0) startAct(z,'melee',z.boss?0.75:0.42);
    else if(z.type==='spitter'&&z.rcd<=0&&d>5&&d<38&&z.los) startAct(z,'spit',0.55);
    else if(z.boss&&z.rcd<=0&&d>7&&d<55&&z.los){ startAct(z,'volley',0.7); AU.roar(z.x,z.z); }
    else if(z.boss&&S.level>=6&&z.ccd<=0&&d>10&&d<35&&z.los){ startAct(z,'charge',1.1); z.cdx=dx/d; z.cdz=dz/d; z.chargeHit=false; AU.roar(z.x,z.z); }
  }
  // steering
  let tx=z.tx-z.x, tz=z.tz-z.z;
  if(z.act==='charge'){ tx=z.cdx; tz=z.cdz; }
  const tl=Math.hypot(tx,tz)||1;
  const want=(z.act!=='charge'&&d<z.r+PR+0.1)?0:spd;
  const acc=Math.min(1,dt*(z.type==='runner'?10:6));
  z.vx+=(tx/tl*want-z.vx)*acc; z.vz+=(tz/tl*want-z.vz)*acc;
  moveZ(z,(z.vx+z.kx)*dt,(z.vz+z.kz)*dt);
  // stay outside the player
  const ox=z.x-player.x, oz=z.z-player.z, od=Math.hypot(ox,oz), rr=z.r+PR;
  if(od<rr&&od>0.001&&!player.dead){ const nx=player.x+ox/od*rr, nz=player.z+oz/od*rr; if(!boxHitsWall(nx,nz,z.r*0.85)){ z.x=nx; z.z=nz; } }
  const face=(z.los||d<12)?Math.atan2(dx,dz):Math.atan2(z.vx,z.vz);
  z.yaw=lerpAngle(z.yaw,face,dt*(z.act==='charge'?2:8));
  root.position.set(z.x,0,z.z); root.rotation.y=z.yaw;
  animZ(z,dt,t,Math.hypot(z.vx,z.vz));
  if(z.boss&&z.act!=='volley'){ const g=z.parts.glow.color; g.setScalar(Math.max(0.55,g.r-dt*1.5)); }
  if(z.boss&&z.act==='volley') z.parts.glow.color.setScalar(0.8+Math.random()*0.2);
}
function animZ(z,dt,t,mv){
  const P=z.parts, run=z.type==='runner', s0=z.seed;
  z.ph+=dt*(1.2+mv*(run?0.9:1.25)/Math.max(0.8,z.scale));
  const s=Math.sin(z.ph), c=Math.cos(z.ph);
  const legA=mv>0.3?Math.min(0.75,0.25+mv*0.08):0.04;
  P.legL.rotation.x=s*legA; P.legR.rotation.x=-s*legA;
  P.hip.position.y=z.hipY+Math.abs(c)*0.07*(mv>0.3?1:0.3);
  P.torso.rotation.z=s*0.09+Math.sin(t*0.7+s0)*0.05;
  P.torso.rotation.x=z.lean+(z.pain>0?-0.35:0)+Math.sin(z.ph*2)*0.03+(z.act==='charge'?0.3:0);
  if(Math.random()<dt*0.8) z.twitch=sp()*0.5; z.twitch*=Math.exp(-dt*6);
  P.head.rotation.z=Math.sin(t*1.7+s0)*0.15+z.twitch;
  P.head.rotation.x=-z.lean*0.75+Math.sin(t*2.3+s0)*0.08;
  P.jaw.rotation.x=0.22+Math.max(0,Math.sin(t*6+s0))*0.35;
  let aL,aR;
  if(!z.awake){ aL=-0.3+Math.sin(t*0.8+s0)*0.1; aR=-0.25+Math.sin(t*0.9+s0+1)*0.1; }
  else if(run){ aL=s*1.1+0.35; aR=-s*1.1+0.35; }
  else if(z.boss){ aL=-0.5+s*0.25; aR=-0.4-s*0.25; }
  else { aL=-1.45+Math.sin(z.ph*0.5)*0.18; aR=-1.3+Math.sin(z.ph*0.5+1.3)*0.18; }
  if(z.act==='melee'){
    const k=1-z.actT/z.actDur, sw=k<0.65?-2.9*(k/0.65):-2.9+(k-0.65)/0.35*2.6;
    if(z.boss){ aR=sw; aL=sw*0.6; } else { aL=aR=sw; }
    P.jaw.rotation.x=0.75;
  } else if(z.act==='spit'||z.act==='volley'){
    P.jaw.rotation.x=1.0; P.head.rotation.x=-z.lean-0.35;
    if(z.act==='volley'){ aL=-1.8; aR=-1.8; P.torso.rotation.x=z.lean-0.35; }
  } else if(z.act==='charge'){ aL=0.6; aR=0.6; }
  P.armL.rotation.x=aL; P.armR.rotation.x=aR; P.armL.rotation.z=-0.12; P.armR.rotation.z=0.12;
}
function deadZ(z,dt){
  z.deathT+=dt;
  if(z.gone){ z.remove=true; return; }
  const P=z.parts, k=Math.min(1,z.deathT/(z.boss?1.2:0.55)), e=k*k;
  z.root.rotation.x=-Math.PI/2*0.92*e;
  P.armL.rotation.x+=(-2.6-P.armL.rotation.x)*Math.min(1,dt*5); P.armR.rotation.x+=(-2.2-P.armR.rotation.x)*Math.min(1,dt*5);
  P.jaw.rotation.x=0.8; P.legL.rotation.x*=0.9; P.legR.rotation.x*=0.9;
  z.mat.emissive.setRGB(0,0,0);
  if(z.burnT>0){ z.burnT-=dt; if(Math.random()<0.7) fxA.add(0,z.x+sp()*z.r*1.5,rand(0.2,1),z.z+sp()*z.r*1.5,0,rand(1,2.5),0,0.5,0.4*z.scale,1.2*z.scale,-1,1); }
  if(z.deathT>7) z.root.position.y-=dt*0.4;
  if(z.deathT>12) z.remove=true;
}
function updateZombies(dt,t){
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    if(z.dead){ deadZ(z,dt); if(z.remove){ disposeZombie(z); zombies.splice(i,1); } continue; }
    liveZ(z,dt,t);
  }
  const n=zombies.length;
  for(let i=0;i<n;i++){
    const a=zombies[i]; if(a.dead||a.rise>0) continue;
    for(let j=i+1;j<n;j++){
      const b=zombies[j]; if(b.dead||b.rise>0) continue;
      const dx=b.x-a.x, dz=b.z-a.z, rr=a.r+b.r, d2=dx*dx+dz*dz;
      if(d2<rr*rr&&d2>1e-6){
        const d=Math.sqrt(d2), o=(rr-d), wa=b.mass/(a.mass+b.mass), wb=1-wa, ux=dx/d, uz=dz/d;
        if(!boxHitsWall(a.x-ux*o*wa,a.z-uz*o*wa,a.r*0.85)){ a.x-=ux*o*wa; a.z-=uz*o*wa; }
        if(!boxHitsWall(b.x+ux*o*wb,b.z+uz*o*wb,b.r*0.85)){ b.x+=ux*o*wb; b.z+=uz*o*wb; }
      }
    }
    for(const br of barrels){ if(br.dead) continue; const dx=a.x-br.x, dz=a.z-br.z, d=Math.hypot(dx,dz), rr=a.r+br.r; if(d<rr&&d>0.001&&!boxHitsWall(br.x+dx/d*rr,br.z+dz/d*rr,a.r*0.85)){ a.x=br.x+dx/d*rr; a.z=br.z+dz/d*rr; } }
  }
}

// ---------- spawning / level ----------
const CAP=18;
function farSpot(minD,needHidden){
  for(let tries=0;tries<60;tries++){
    const c=pick(floorCells); const [cx,cz]=center(c);
    const x=cx+sp()*1.6, z=cz+sp()*1.6;
    const d=Math.hypot(x-player.x,z-player.z);
    if(d<minD) continue;
    if(needHidden&&los(player.x,player.z,x,z)) continue;
    if(Math.hypot(x-exitObj.x,z-exitObj.z)<3) continue;
    return [x,z];
  }
  return null;
}
function spawner(dt){
  if(S.spawned>=S.normalTotal) return;
  S.spawnT-=dt; if(S.spawnT>0) return;
  const alive=zombies.reduce((n,z)=>n+(z.dead?0:1),0);
  if(alive>=CAP){ S.spawnT=0.5; return; }
  const p=farSpot(26,true); if(!p){ S.spawnT=0.5; return; }
  spawnZombie(rollType(),p[0],p[1],{rise:true,awake:true}); S.spawned++;
  S.spawnT=rand(1.2,2.8)/(Math.min(2,1+S.level*0.08)*SK().spd);
}
function clearLevel(){
  zombies.forEach(disposeZombie); zombies=[];
  shots=[]; eshots=[];
  pickups.forEach(p=>scene.remove(p.m)); pickups=[];
  barrels.forEach(b=>scene.remove(b.g)); barrels=[];
  decals.forEach(d=>d.visible=false);
  fxA.clear(); fxN.clear(); flowCell=-1;
}
function savePlayer(){ const p=player; return JSON.stringify({hp:p.hp,maxHp:p.maxHp,armor:p.armor,fuel:p.fuel,cells:p.cells,up:p.up,score:S.score}); }
function loadPlayer(s){ const o=JSON.parse(s), p=player; p.hp=o.hp; p.maxHp=o.maxHp; p.armor=o.armor; p.fuel=o.fuel; p.cells=o.cells; p.up=o.up; S.score=o.score; }
function resetPlayerBody(){
  const p=player, [x,z]=center(marks.P);
  p.x=p.px=x; p.z=p.pz=z; p.yaw=-Math.PI/2; p.momx=p.momz=0; p.dead=false; p.deadT=0; p.hurtT=0; p.cool=0.3;
  WEAP.forEach(w=>w.root.visible=false); p.weapon=0; p.nextWeapon=0; p.switchT=0; WEAP[0].root.visible=true;
}
function startLevel(fresh){
  clearLevel();
  const L=S.level; S.diff=diff(L);
  S.kills=0; S.time=0; S.exitOpen=false; S.spawned=0; S.spawnT=3;
  S.bossCount=S.diff.bosses; S.normalTotal=S.diff.total; S.total=S.normalTotal+S.bossCount;
  const P=applyPalette(L);
  resetPlayerBody();
  if(!fresh){ player.fuel=Math.min(maxFuel(),player.fuel+Math.round(50*SK().ammo)); player.cells=Math.min(MAXCELLS,player.cells+Math.round(50*SK().ammo)); player.hp=Math.min(player.maxHp,player.hp+25); }
  S.snapshot=savePlayer();

function updatePickups(dt,t){
  const p=player;
  for(let i=pickups.length-1;i>=0;i--){
    const k=pickups[i]; k.m.rotation.y+=dt*1.6; k.m.position.y=0.65+Math.sin(t*2.5+k.ph)*0.12;
    if(p.dead||Math.hypot(p.x-k.x,p.z-k.z)>1.6) continue;
    let amt=0;
    if((k.type==='med'||k.type==='stim')&&p.hp<p.maxHp){ amt=k.type==='med'?25:10; p.hp=Math.min(p.maxHp,p.hp+amt); }
    else if(k.type==='armor'&&p.armor<MAXARMOR){ amt=50; p.armor=Math.min(MAXARMOR,p.armor+amt); }
    else if(k.type==='fuel'&&p.fuel<maxFuel()){ amt=Math.round(60*SK().ammo); p.fuel=Math.min(maxFuel(),p.fuel+amt); }
    else if(k.type==='cells'&&p.cells<MAXCELLS){ amt=Math.round(40*SK().ammo); p.cells=Math.min(MAXCELLS,p.cells+amt); }
    if(amt){ msg(tr('pick_'+k.type,amt),PICK_INFO[k.type].col); AU.pick(); fxPick=0.6; scene.remove(k.m); pickups.splice(i,1); }

const logoCv=document.createElement('canvas'); logoCv.id='logo';
function drawLogo(){
  // Tiny5 sits on an exact pixel grid at 8px; draw there, then blow each font pixel up to UxU
  const text=tr('title').toUpperCase(), fs=8, U=3, font=`${fs}px Tiny5, 'Courier New', monospace`;
  const mc=document.createElement('canvas'); let mg=mc.getContext('2d'); mg.font=font;
  const sw=Math.ceil(mg.measureText(text).width)+4, sh=fs+6;
  mc.width=sw; mc.height=sh; mg=mc.getContext('2d'); mg.font=font; mg.fillStyle='#fff'; mg.textBaseline='top'; mg.fillText(text,2,3);
  const src=mg.getImageData(0,0,sw,sh).data, w=sw*U, h=sh*U;
  const A=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&src[(Math.floor(y/U)*sw+Math.floor(x/U))*4+3]>110;
  let top=h,bot=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(A(x,y)){ if(y<top) top=y; if(y>bot) bot=y; }
  if(bot<0) return;
  // flare each letter around its own centre (top wider than bottom), then add drips, a hard outline and a drop shadow
  const gh=bot-top+1, flare=0.22, pad=3, drip=14;
  const segs=[]; let a=-1;
  for(let x=0;x<=w;x++){ let on=false; if(x<w) for(let y=top;y<=bot;y++) if(A(x,y)){ on=true; break; } if(on&&a<0) a=x; if(!on&&a>=0){ segs.push([a,x-1]); a=-1; } }
  let OW=pad*2; const place=[];
  segs.forEach(([sa,sb],i)=>{ const gw=Math.ceil((sb-sa+1)*(1+flare)); if(i) OW+=sa-segs[i-1][1]-1; place.push(OW); OW+=gw; });
  const OH=gh+pad*2+drip, G=new Uint8Array(OW*OH);
  segs.forEach(([sa,sb],i)=>{
    const sw0=sb-sa+1, gw=Math.ceil(sw0*(1+flare));
    for(let r=0;r<gh;r++){ const f=1+flare*(1-r/Math.max(1,gh-1));
      for(let ox=0;ox<gw;ox++){ const sx=sa+Math.floor((ox-gw/2)/f+sw0/2); if(sx>=sa&&sx<=sb&&A(sx,top+r)) G[(r+pad)*OW+place[i]+ox]=1; } }
  });
  const D=new Uint8Array(OW*OH);
  for(let x=0;x<OW;x++){
    let y=-1; for(let r=OH-1;r>=0;r--) if(G[r*OW+x]){ y=r; break; }
    if(y<0||Math.random()>0.24) continue;
    const len=2+Math.floor(Math.random()*Math.random()*drip);
    for(let k=1;k<=len&&y+k<OH;k++) D[(y+k)*OW+x]=1;
    if(len>4&&y+len+1<OH){ D[(y+len+1)*OW+x]=2; if(x+1<OW) D[(y+len)*OW+x+1]=2; }
  }
  const out=new ImageData(OW,OH), o=out.data;
  const set=(x,y,c,a=255)=>{ const i=(y*OW+x)*4; o[i]=c>>16; o[i+1]=c>>8&255; o[i+2]=c&255; o[i+3]=a; };
  const isF=(x,y)=>x>=0&&y>=0&&x<OW&&y<OH&&(G[y*OW+x]||D[y*OW+x]);
  const ramp=[0xfff0a0,0xffd060,0xffa030,0xf87020,0xe04818,0xc02a10,0x9a1a0a,0x701006];
  for(let y=0;y<OH;y++) for(let x=0;x<OW;x++){
    if(isF(x,y)){
      const d=D[y*OW+x]; if(d){ set(x,y,d===2?0xb01408:0x7a0c06); continue; }
      const k=Math.min(ramp.length-1,Math.floor((y-pad)/gh*ramp.length));
      set(x,y,!isF(x,y-1)?0xfff6c8:!isF(x,y+1)?0x5a0c04:!isF(x-1,y)?ramp[Math.max(0,k-2)]:ramp[k]);
    } else {
      let edge=false;
      for(let dy=-1;dy<=1&&!edge;dy++) for(let dx=-1;dx<=1;dx++) if(isF(x+dx,y+dy)){ edge=true; break; }
      if(edge) set(x,y,0);
      else if(isF(x-2,y-2)||isF(x-1,y-2)||isF(x-2,y-1)) set(x,y,0,150);
    }
  }
  logoCv.width=OW; logoCv.height=OH; logoCv.getContext('2d').putImageData(out,0,0);
  sizeLogo();
}

const SCREENS={
  title:()=>({logo:true, any:()=>{ AU.init(); AU.menuSel(); openMenu('main'); },
    extra:`<div class="press blink">${tr('pressKey')}</div>`, foot:[bestText(),S.touch?tr('touch'):''].filter(Boolean).join('<br>'), items:[]}),
  main:()=>({logo:true, back:()=>openMenu('title'), foot:bestText(), items:[
    {label:tr('mNew'), act:()=>openMenu('skill',true)},
    {label:tr('mSettings'), act:()=>openMenu('settings',true)},
    {label:tr('mControls'), act:()=>openMenu('controls',true)}]}),
  skill:()=>({head:tr('hSkill'), sel:S.skill, back:backMenu, items:SKILLS.map((_,i)=>({label:tr('sk'+i), desc:tr('skd'+i),
    act:()=>{ if(i===3) openMenu('nightmare',true); else beginGame(i); }}))}),
  nightmare:()=>({head:tr('sk3'), text:tr('nightmareQ'), sel:1, back:backMenu, items:[
    {label:tr('yes'), act:()=>beginGame(3)}, {label:tr('no'), act:backMenu}]}),
  settings:()=>({head:tr('mSettings').toUpperCase(), cls:'sm', back:backMenu, items:[
    {label:tr('oLang'), val:LANG==='ru'?'РУССКИЙ':'ENGLISH', change:()=>setLang(LANG==='ru'?'en':'ru')},
    {label:tr('oSkill'), val:tr('sk'+S.skill), desc:tr('skd'+S.skill)+(S.mode!=='menu'?'. '+tr('skNote'):''), change:d=>setSkill((S.skill+d+4)%4)},
    {label:tr('oCtrl'), val:tr(S.ctrl==='mouse'?'vMouse':'vKeys'), desc:tr(S.ctrl==='mouse'?'dMouse':'dKeys'), change:toggleCtrl},
    {label:tr('oPx'), val:tr(S.pixel?'v1993':'vSharp'), desc:tr(S.pixel?'dPx':'dSharp'), change:togglePx},
    {label:tr('oCrt'), val:tr(S.crt?'vCrt':'vClean'), desc:tr(S.crt?'dCrt':'dClean'), change:toggleCrt},
    {label:tr('oSnd'), val:tr(S.sound?'on':'off'), change:toggleSnd},
    {label:tr('mBack'), act:backMenu}]}),
  controls:()=>({head:tr('mControls').toUpperCase(), html:controlsHTML(), back:backMenu, items:[{label:tr('mBack'), act:backMenu}]}),
  pause:()=>({head:tr('hPause'), back:resume, items:[
    {label:tr('mResume'), act:resume},
    {label:tr('mRestart'), act:retry},
    {label:tr('mSettings'), act:()=>openMenu('settings',true)},
    {label:tr('mControls'), act:()=>openMenu('controls',true)},
    {label:tr('mQuit'), act:()=>openMenu('quit',true)}]}),
  quit:()=>({head:tr('mQuit').toUpperCase(), text:tr('quitQ'), back:backMenu, items:[
    {label:tr('no'), act:backMenu}, {label:tr('yes'), act:toMenu}]}),
  inter:()=>{ const nd=diff(S.level+1); return {head:tr('lvlDone',S.level), html:'<div class="stats" id="istats"></div>', sub:tr('pickUp'), cls:'sm',
    foot:tr('upNext',S.level+1,nd.total,nd.bosses), onOpen:renderCount,
    items:choices.map((u,i)=>({label:`<span class="w${u.w}">${tr('wtag')[u.w]}:</span> ${upT(u)}`, desc:upD(u)+'. '+mkText(u), act:()=>chooseUpgrade(i)}))}; },
  dead:()=>({head:tr('hDead'), html:'<div class="stats">'+statRow(tr('stLevel'),S.level)+statRow(tr('stKills'),S.kills+' / '+S.total)+statRow(tr('stScore'),S.score)+statRow(tr('skillName'),tr('sk'+S.skill))+'</div>', items:[
    {label:tr('mRetry'), act:retry},
    {label:tr('mNew'), act:()=>openMenu('skill',true)},
    {label:tr('mQuit'), act:toMenu}]}),
};
function openMenu(name,push){ if(push&&menu) menuStack.push({name:menu.name,sel:menu.sel}); buildMenu(name); }
function backMenu(){ const prev=menuStack.pop(); if(prev) buildMenu(prev.name,prev.sel); }
function closeMenu(){ menu=null; menuStack.length=0; ui.hidden=true; ui.innerHTML=''; }
function rebuild(){ if(menu) buildMenu(menu.name,menu.sel); }
function buildMenu(name,sel){
  const spec=SCREENS[name]();
  menu={name,spec,sel:sel??spec.sel??0};
  let h='';
  if(spec.logo) h+='<canvas id="logo-slot"></canvas>';
  if(spec.head) h+=`<div class="uihead">${spec.head}</div>`;
  if(spec.text) h+=`<div class="utext">${spec.text}</div>`;
  if(spec.html) h+=spec.html;
  if(spec.extra) h+=spec.extra;
  if(spec.sub) h+=`<div class="usub">${spec.sub}</div>`;
  if(spec.items.length){
    h+=`<div class="items ${spec.cls||''}">`+spec.items.map((it,i)=>`<button type="button" tabindex="-1" class="item" data-i="${i}"><span>${it.label}</span>${it.val!==undefined?`<span class="val">${it.val}</span>`:''}</button>`).join('')+'</div>';
    if(spec.items.some(it=>it.desc)) h+='<div class="desc" id="udesc"></div>';
    h+=`<div class="uhint">${tr('hint')}</div>`;
  }
  if(spec.foot) h+=`<div class="ufoot">${spec.foot}</div>`;
  ui.innerHTML=h; ui.hidden=false; ui.classList.toggle('over-hud',!$('hud').hidden);
  if(spec.logo) ui.querySelector('#logo-slot').replaceWith(logoCv);
  ui.querySelectorAll('.item').forEach(b=>{
    const i=+b.dataset.i;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('mouseenter',()=>setSel(i));
    b.addEventListener('click',e=>{ e.stopPropagation(); menu.sel=i; activate(1); });
  });
  setSel(menu.sel,true);
  if(spec.onOpen) spec.onOpen();
}
function setSel(i,quiet){
  if(!menu) return; const n=menu.spec.items.length; if(!n) return;
  i=(i+n)%n; if(i!==menu.sel&&!quiet) AU.menuMove();
  menu.sel=i;
  ui.querySelectorAll('.item').forEach((b,j)=>b.classList.toggle('sel',j===i));
  const d=$('udesc'); if(d) d.textContent=menu.spec.items[i].desc||'';
}
function activate(dir){
  const it=menu&&menu.spec.items[menu.sel]; if(!it) return;
  if(it.change){ it.change(dir); AU.menuMove(); rebuild(); }
  else if(it.act){ AU.menuSel(); it.act(); }
}
function menuKey(e){
  if(!menu) return;
  const c=e.code;
  if(menu.spec.any){ if(!e.repeat) menu.spec.any(); return; }
  if(c==='ArrowUp'||c==='KeyW') setSel(menu.sel-1);
  else if(c==='ArrowDown'||c==='KeyS') setSel(menu.sel+1);
  else if(c==='ArrowLeft'||c==='KeyA'||c==='ArrowRight'||c==='KeyD'){ const it=menu.spec.items[menu.sel]; if(it&&it.change&&!e.repeat) activate(c==='ArrowLeft'||c==='KeyA'?-1:1); }
  else if((c==='Enter'||c==='NumpadEnter'||c==='Space')&&!e.repeat) activate(1);
  else if((c==='Escape'||c==='Backspace')&&!e.repeat&&menu.spec.back){ AU.menuBack(); menu.spec.back(); }
  else if(/^Digit[1-9]$/.test(c)&&!e.repeat){ const i=+c.slice(5)-1; if(i<menu.spec.items.length){ setSel(i,true); activate(1); } }
}
ui.addEventListener('click',()=>{ if(menu&&menu.spec.any) menu.spec.any(); });
function renderCount(){
  const el=$('istats'); if(!el||!inter) return;
  const k=inter.t;
  el.innerHTML=statRow(tr('stKills'),Math.round(inter.kills*k)+' / '+inter.total)+statRow(tr('stTime'),fmtTime(inter.time*k))+statRow(tr('stScore'),Math.round(inter.score*k));
}
let skullT=0, skullF=0;
function uiTick(dt){
  skullT+=dt; if(skullT>0.23){ skullT=0; skullF^=1; document.documentElement.style.setProperty('--skull',SKULL[skullF]); }
  stepMelt(dt);
  if(inter&&inter.t<1&&S.mode==='upgrade'&&!melt){ inter.t=Math.min(1,inter.t+dt/1.3); inter.tick+=dt; if(inter.tick>0.07){ inter.tick=0; AU.tick(); } renderCount(); }
}

// ---------- modes ----------
function showHUD(on){ $('hud').hidden=!on; $('minimap').hidden=!on; }
function setPlayUI(on){ $('crosshair').hidden=!on; $('btn-menu').hidden=!on; if(!on) $('bossbar').hidden=true; }
function lock(){ if(S.ctrl!=='mouse') return; try{ const r=canvas.requestPointerLock(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
function unlock(){ try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){} }
function toPlay(){ S.mode='play'; closeMenu(); showHUD(true); setPlayUI(true); keys.Space=keys.Enter=false; mouseDown=false; lock(); last=performance.now(); }
function saveBest(){ const b=+(lsGet('ds-best')||0); if(S.level>b) lsSet('ds-best',String(S.level)); }
function beginGame(skill){
  AU.init(); setSkill(skill); startMelt();
  const p=player; p.hp=100; p.maxHp=100; p.armor=0; p.fuel=150; p.cells=120; p.up=UPG_ZERO();
  S.level=1; S.score=0; startLevel(true); toPlay();
}
function pause(){ if(S.mode!=='play') return; S.mode='paused'; mouseDown=false; AU.flame(false); unlock(); setPlayUI(false); menuStack.length=0; openMenu('pause'); }
function resume(){ if(S.mode!=='paused') return; AU.init(); toPlay(); }
function levelComplete(){
  S.mode='upgrade'; mouseDown=false; AU.flame(false); unlock(); saveBest();
  setPlayUI(false); showHUD(false); rollChoices();
  inter={t:0,tick:0,kills:S.kills,total:S.total,time:S.time,score:S.score};
  menuStack.length=0; startMelt(); openMenu('inter');
}
function chooseUpgrade(i){
  if(S.mode!=='upgrade'||!choices[i]) return;
  applyUpgrade(choices[i]); msg(tr('upgradeMsg',upT(choices[i])),'#f2a531');
  inter=null; S.level++; startMelt(); startLevel(false); toPlay();
}
function showDead(){ S.mode='dead'; unlock(); AU.flame(false); saveBest(); setPlayUI(false); menuStack.length=0; openMenu('dead'); }
function retry(){ AU.init(); startMelt(); loadPlayer(S.snapshot); refreshWeapons(); startLevel(true); toPlay(); }
function toMenu(){ startMelt(); S.mode='menu'; unlock(); AU.flame(false); clearLevel(); S.level=1; S.diff=diff(1); startMenuScene(); showHUD(false); setPlayUI(false); menuStack.length=0; openMenu('main'); }

// ---------- options ----------
function applyLang(){ applyStatic(); drawLogo(); hudCache={}; rebuild(); if(S.mode!=='menu') hud(0); }
function setSkill(v){ if(v===S.skill) return; S.skill=v; lsSet('ds-skill',String(v)); if(S.mode==='paused') msg(tr('skillMsg',tr('sk'+v)),'#f2a531'); }
function setLang(v){ if(v===LANG||!I18N[v]) return; LANG=v; lsSet('ds-lang',v); applyLang(); }
function toggleCtrl(){ S.ctrl=S.ctrl==='mouse'?'classic':'mouse'; lsSet('ds-ctrl',S.ctrl); }
function togglePx(){ S.pixel=!S.pixel; lsSet('ds-px',S.pixel?'1':'0'); resize(); }
function toggleCrt(){ S.crt=!S.crt; lsSet('ds-crt',S.crt?'1':'0'); $('crt').hidden=!S.crt; }
function toggleSnd(){ S.sound=!S.sound; lsSet('ds-snd',S.sound?'1':'0'); AU.setOn(S.sound); }
S.ctrl=lsGet('ds-ctrl')==='classic'?'classic':'mouse';
S.pixel=lsGet('ds-px')!=='0';
S.sound=lsGet('ds-snd')!=='0';
S.crt=lsGet('ds-crt')!=='0'; $('crt').hidden=!S.crt;
S.touch=matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches;
$('btn-menu').addEventListener('mousedown',e=>{ e.preventDefault(); e.stopPropagation(); });
$('btn-menu').onclick=pause;

// ---------- input ----------
addEventListener('keydown',e=>{
  const c=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Enter','Backspace'].includes(c)) e.preventDefault();
  keys[c]=true;
  if(S.mode!=='play') menuKey(e);
  else if(!e.repeat){
    if(c==='Digit1') selectWeapon(0); else if(c==='Digit2') selectWeapon(1); else if(c==='Digit3') selectWeapon(2);
    else if(c==='Escape'||c==='KeyP') pause();
  }
  if(e.repeat) return;
  if(c==='KeyM'&&!(menu&&menu.spec.any)){ toggleSnd(); if(menu&&menu.name==='settings') rebuild(); }
  if(c==='KeyF'){ try{ if(document.fullscreenElement) document.exitFullscreen(); else { const r=$('game').requestFullscreen(); if(r&&r.catch) r.catch(()=>{}); } }catch(err){} }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouseDown=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
canvas.addEventListener('mousedown',e=>{
  if(S.mode!=='play') return;
  if(S.ctrl==='mouse'&&document.pointerLockElement!==canvas) lock();
  if(e.button===0) mouseDown=true;
});
addEventListener('mouseup',e=>{ if(e.button===0) mouseDown=false; });
addEventListener('mousemove',e=>{ if(S.mode==='play'&&document.pointerLockElement===canvas&&!player.dead) player.yaw-=e.movementX*0.0026*S.sens; });
addEventListener('wheel',e=>{ if(S.mode!=='play') return; const n=(player.weapon+(e.deltaY>0?1:2))%3; selectWeapon(n); },{passive:true});
document.addEventListener('pointerlockchange',()=>{ const l=document.pointerLockElement===canvas; if(!l&&S.wasLocked&&S.mode==='play') pause(); S.wasLocked=l; });
document.addEventListener('pointerlockerror',()=>{ if(S.mode==='play') msg(tr('noLock'),'#f2a531'); });

// ---------- resize ----------
function resize(){
  const w=Math.max(1,innerWidth), h=Math.max(1,innerHeight), aspect=w/h;
  let scale;
  if(S.pixel){ renderH=Math.min(h,400); scale=renderH/h; }
  else { scale=Math.min(window.devicePixelRatio||1,1.5); renderH=h*scale; }
  renderer.setSize(Math.round(w*scale),Math.round(h*scale),false);
  canvas.classList.toggle('smooth',!S.pixel);
  const vfov=clamp(2*Math.atan(Math.tan(Math.PI/4)/aspect)*180/Math.PI,52,92);
  camera.fov=vfov; camera.aspect=aspect; camera.updateProjectionMatrix();
  wcam.aspect=aspect; wcam.fov=aspect<1?68:50; wcam.updateProjectionMatrix();
  pScale=renderH/(2*Math.tan(vfov*Math.PI/360));
  fxA.mat.uniforms.uScale.value=pScale; fxN.mat.uniforms.uScale.value=pScale;
  sizeLogo();
}
addEventListener('resize',resize);

// ---------- main loop ----------
let last=performance.now(), acc=0;
function step(dt,t){
  S.time+=dt;
  acc+=dt; let n=0;
  while(acc>=TIC&&n<6){ playerTic(); acc-=TIC; n++; }
  if(n>=6) acc=0;
  S.alpha=acc/TIC;
  updateFlow();
  weaponUpdate(dt);
  updateShots(dt); updateEShots(dt);
  updateZombies(dt,t);
  updateBarrels(dt);
  updatePickups(dt,t);
  spawner(dt);
  updatePortal(dt,t);
  updateLights(dt,t);
  fxA.update(dt); fxN.update(dt);
  const p=player;
  if(p.hurtT>0) p.hurtT-=dt; if(p.grinT>0) p.grinT-=dt; if(p.lookT>0) p.lookT-=dt;
  if(p.dead){ p.deadT+=dt; if(p.deadT>1.8&&S.mode==='play') showDead(); }
  hud(dt);
}
function startMenuScene(){
  S.diff=diff(1); applyPalette(1);
  const spots=[[14.5,15.5,'walker'],[17,17,'brute'],[12,17.5,'runner'],[16,13.6,'spitter'],[10.5,14,'walker']];
  spots.forEach(([cx,cz,tp])=>{ const z=spawnZombie(tp,cx*CELL,cz*CELL,{}); z.yaw=Math.atan2(13*CELL-z.x,14*CELL-z.z)+sp()*0.4; z.root.rotation.y=z.yaw; });
  marks.B.slice(0,1).forEach(c=>{ const [x,z]=center(c); spawnBarrel(x,z); });
  player.x=player.px=12.8*CELL; player.z=player.pz=13.6*CELL;
}
function menuStep(dt,t){
  S.menuT+=dt;
  player.yaw=-2.35+Math.sin(S.menuT*0.12)*0.5;
  player.tic++; player.bob=0;
  for(const z of zombies){ if(!z.dead){ z.root.position.set(z.x,0,z.z); animZ(z,dt,t,0); } }
  updatePortal(dt,t); updateLights(dt,t); fxA.update(dt); fxN.update(dt);
}
function render(t){
  const p=player, a=S.alpha;
  const rx=p.px+(p.x-p.px)*a, rz=p.pz+(p.z-p.pz)*a;
  const tic=p.tic+a;
  const bobAmt=p.bob*(REDUCED?0.35:0.6);
  const viewBob=bobAmt/2*K*Math.sin(TAU*tic/20);
  let vz=EYE+viewBob, roll=0;
  if(p.dead){ const k=Math.min(1,p.deadT/0.8); vz=EYE-(EYE-0.45)*k*k; roll=0.5*k; }
  let shx=0,shz=0,shy=0;
  if(S.shake>0){ shx=sp()*S.shake*0.25; shz=sp()*S.shake*0.25; shy=sp()*S.shake*0.12; S.shake=Math.max(0,S.shake-1/60*2.2); }
  camera.position.set(rx+shx,vz+shy,rz+shz);
  camera.rotation.set(0,p.yaw,roll);
  lantern.position.set(rx,vz+0.3,rz);
  // weapon: doom bob (period 64 tics), switch lower/raise, recoil
  const wa=TAU*tic/64, wb=p.bob/16*(REDUCED?0.5:1);
  let wy=-Math.abs(Math.sin(wa))*0.035*wb, wx=Math.cos(wa)*0.05*wb;
  if(p.switchT>0){ const k=p.switchT>0.16?(0.32-p.switchT)/0.16:p.switchT/0.16; wy-=clamp(k,0,1)*0.55; }
  if(p.dead) wy-=Math.min(1,p.deadT*2)*0.7;
  holder.position.set(wx,wy,0);
  const W0=WEAP[0];
  W0.guns.forEach((g,i)=>{ const b=W0.base[i], r=p.recoil[i]; g.g.position.set(b[0],b[1]+r*0.03,b[2]+r*0.09); g.g.rotation.set(r*0.22,i?-0.06:0.06,0); });
  for(const i of [1,2]){ const w=WEAP[i], b=w.base, r=p.recoil[0]; w.root.position.set(b[0]+(i===1?sp()*0.003*(w.flashT>0?1:0):0),b[1]+r*0.02,b[2]+r*0.06); w.root.rotation.set(r*0.08,0.05,0); }
  renderer.clear(); renderer.render(scene,camera);
  if(S.mode!=='menu'){ renderer.clearDepth(); renderer.render(wscene,wcam); }
  if(S.mode==='play'&&(p.tic&1)===0) drawMinimap();
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1; if(dt<0) dt=0;
  const t=now/1000;
  if(S.mode==='play') step(dt,t);
  else if(S.mode==='menu') menuStep(dt,t);
  render(t);
  uiTick(dt);
}

// ---------- boot ----------
buildWorld();
resize();
applyLang();
startMenuScene();
showHUD(false);
openMenu('title');
try{ document.fonts.load('8px Tiny5','МЁРТВЫЙ СЕКТОР DEAD SECTOR').then(()=>{ drawLogo(); rebuild(); }); }catch(e){}
requestAnimationFrame(frame);
window.__ds={S,player,zombies:()=>zombies,startLevel,levelComplete};
})();
</script>
